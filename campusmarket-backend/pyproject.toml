[project]
name = "campusmarket-backend"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "psycopg2-binary>=2.9",
    "pydantic-settings>=2.4",
    "alembic>=1.13",
    "python-multipart>=0.0.32",
    "pyjwt>=2.15.1",
    "email-validator>=2.3.0",
    "pymupdf>=1.24",
    "pillow>=10.4",
    "httpx>=0.27",
    "argon2-cffi>=23.1",
    "cryptography>=43",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
filterwarnings = ["ignore:builtin type swig:DeprecationWarning"]
